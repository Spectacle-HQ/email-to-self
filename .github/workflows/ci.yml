name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    # The ruleset on main requires this check by name: rename it there too.
    name: Test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 11 fails an install that has unapproved dependency build scripts
      # (esbuild's here), and nothing below needs them to have run.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint, typecheck, test, build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
